services:
  certmgr-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familytimenet-certmgr-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    labels:
      - caddy=certmgr.familytimenet.com
      - caddy.reverse_proxy={{upstreams 3000}}
    networks:
      - backbone_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy-proxy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: familytimenet-caddy-router
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_INGRESS_NETWORKS: backbone_net
      CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - backbone_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  backbone_net:
    external: true
    name: backbone_net
