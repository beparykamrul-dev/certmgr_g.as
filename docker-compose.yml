services:
  postgres:
    image: postgres:17-alpine
    container_name: familytimenet-certmgr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftn_cert_control}
      POSTGRES_USER: ${POSTGRES_USER:-ftn_cert_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - certmgr_postgres_data:/var/lib/postgresql/data
    networks:
      - backbone_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  certmgr-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familytimenet-certmgr-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ftn_cert_control}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ftn_cert_control}}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    labels:
      - caddy=certmgr.familytimenet.com
      - caddy.reverse_proxy={{upstreams 3000}}
    networks:
      - backbone_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy-proxy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: familytimenet-caddy-router
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_INGRESS_NETWORKS: backbone_net
      CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - backbone_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  certmgr_postgres_data:

networks:
  backbone_net:
    external: true
    name: backbone_net
