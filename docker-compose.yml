services:
  caddy-proxy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: familytimenet-caddy-router
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CADDY_INGRESS_NETWORKS=backbone_net
      - CF_API_TOKEN=your_cloudflare_dns_api_token_here
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - backbone_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  database-governance:
    image: bytebase/bytebase:latest
    container_name: familytimenet-db-governance
    restart: always
    labels:
      - caddy=data.familytimenet.com
      - caddy.reverse_proxy={{upstreams 8080}}
    command: --data /var/bytebase --port 8080
    volumes:
      - db_gov_data:/var/bytebase
    networks:
      - backbone_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  certificate-authority:
    image: smallstep/step-ca:latest
    container_name: familytimenet-ca-hub
    restart: always
    labels:
      - caddy=ca.familytimenet.com
      - caddy.reverse_proxy={{upstreams 9000}}
    user: "1000:1000"
    environment:
      - DOCKER_STEPCA_INIT_NAME=FamilyTime-Enterprise-CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=ca.familytimenet.com,localhost
      - DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT=true
      - DOCKER_STEPCA_INIT_PASSWORD=SecureCAPassword123!
    volumes:
      - ./ca-data:/home/step
    networks:
      - backbone_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  traffic-monitor:
    image: grafana/grafana:latest
    container_name: familytimenet-traffic-hub
    restart: always
    labels:
      - caddy=tra.familytimenet.com
      - caddy.reverse_proxy={{upstreams 3000}}
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=SecureGrafanaPassword123!
    volumes:
      - ./grafana-data:/var/lib/grafana
    networks:
      - backbone_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  db_gov_data:

networks:
  backbone_net:
    external: true
    name: backbone_net
